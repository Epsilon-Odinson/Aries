# Build the Aries desktop app 0.8.0 (Electron shell + Python sidecar)
# and publish the installer + portable app as GitHub Release assets.
#
# Trigger it by pushing a tag like v0.8.0-desktop, or by hand from the
# Actions tab (workflow_dispatch). The installer (Aries-Setup.exe,
# electron-builder NSIS) installs Aries, offers a desktop shortcut
# and a taskbar pin. Aries.exe is the portable single file.
#
# 0.8.0: the PC app is self-contained — the sidecar runs the FULL
# production backend on the PC (chat, memory, tasks, voice, face,
# screenshot — the same FastAPI app the website runs), against a
# local SQLite database in %USERPROFILE%\.aries. The cloud is only a
# fallback when the local service is down. No API key is needed on
# first run if the user switches to the cloud; on this PC the engine
# key lives in the Windows Credential Manager (Settings → More →
# Desktop). PC control is off by default — turn it on in Settings,
# and add the NVIDIA engine key there for chat and PC actions.
# Mini mode: press the face to shrink to the floating face, press it
# again (or the Full screen button) to come back to full size.
#
# The release step only runs for tag pushes. A manual dispatch just
# builds and uploads the files as workflow artifacts. The release
# step is idempotent: if the release already exists it uploads the
# assets with --clobber instead of failing.

name: Build Windows .exe

on:
  push:
    tags:
      - "v*-desktop"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q aries production/server/app run_aries.py

      - name: Build the React app into the shell
        shell: bash
        run: bash aries-shell/build-web.sh

      - name: Install the shell's dependencies
        run: npm ci
        working-directory: aries-shell

      - name: Build the Python sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller aries-shell/sidecar.spec
          if (-not (Test-Path dist\aries-service.exe)) { exit 1 }
          New-Item -ItemType Directory -Force -Path aries-shell\sidecar | Out-Null
          Copy-Item dist\aries-service.exe aries-shell\sidecar\aries-service.exe

      - name: Smoke-test the sidecar (local backend)
        run: |
          $proc = Start-Process -FilePath "dist\aries-service.exe" -ArgumentList "--port","0" -RedirectStandardOutput "sidecar-smoke.log" -RedirectStandardError "sidecar-smoke-err.log" -PassThru -WindowStyle Hidden
          try {
            $port = $null
            for ($i=0; $i -lt 90 -and -not $port; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path sidecar-smoke.log) {
                $m = Select-String -Path sidecar-smoke.log -Pattern "ARIES_SERVICE_PORT=(\d+)" | Select-Object -First 1
                if ($m) { $port = $m.Matches.Groups[1].Value }
              }
            }
            if (-not $port) { Get-Content sidecar-smoke.log, sidecar-smoke-err.log -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "sidecar did not print its port" }
            $h = Invoke-RestMethod "http://127.0.0.1:$port/health"
            if (-not $h.ok -or $h.backend -ne "local") { throw "local /health bad: $($h | ConvertTo-Json -Compress)" }
            $ah = Invoke-RestMethod "http://127.0.0.1:$port/api/health"
            if (-not $ah.ok) { throw "local /api/health bad" }
            Write-Host "Sidecar smoke test passed on port $port (local backend $($h.version), api $($ah.version), db $($h.db))"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build the installer + portable app
        run: npx electron-builder --win --x64
        working-directory: aries-shell

      - name: Check the artifacts exist
        run: |
          if (-not (Test-Path aries-shell\dist-installer\Aries-Setup.exe)) { exit 1 }
          if (-not (Test-Path aries-shell\dist-installer\Aries.exe)) { exit 1 }
          $i = (Get-Item aries-shell\dist-installer\Aries-Setup.exe).Length / 1MB
          $p = (Get-Item aries-shell\dist-installer\Aries.exe).Length / 1MB
          Write-Host "Aries-Setup.exe built: $([math]::Round($i, 1)) MB"
          Write-Host "Aries.exe built: $([math]::Round($p, 1)) MB"

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aries-windows-installer
          path: aries-shell/dist-installer/Aries-Setup.exe
          if-no-files-found: error

      - name: Upload the portable app as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aries-windows-exe
          path: aries-shell/dist-installer/Aries.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "Windows build of the Aries desktop app (0.8.0) — the Electron shell. The same React app as the website, bundled locally into a real installed PC program (never the live site in a window), so the desktop is pixel-identical to the web: same veil, same pointer orb, same fonts, same Settings. NEW in 0.8.0: the PC app is self-contained — the local service runs the full backend on your PC (chat, memory, tasks, voice, face login, screenshot), so it works without the live website; the cloud is only a fallback. Your chats and memories on the PC live on the PC. Everyone gets their own login: Epsilon (username Epsilon) is the admin, Kelfy makes her own account and sees only hers. Aries-Setup.exe is the installer — it installs Aries, offers a desktop shortcut and a taskbar pin. Aries.exe is the portable single file — download and run it, no install needed. Add the NVIDIA engine key in Settings → More → Desktop (saved to the Windows Credential Manager) for chat and PC actions, or switch the engine to Cloud there to use the website's backend instead. PC control is off by default — turn it on in Settings. Mini mode: press the face to shrink to the floating face, press it again (or the Full screen button) to come back to full size."
          gh release view $tag --json tagName -q .tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "aries-shell/dist-installer/Aries.exe" "aries-shell/dist-installer/Aries-Setup.exe" --clobber
          } else {
            gh release create $tag --title "Aries desktop $tag" --notes $notes "aries-shell/dist-installer/Aries.exe" "aries-shell/dist-installer/Aries-Setup.exe"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
